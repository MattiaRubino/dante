name: AI Fixture Prettier Fix

on:
  push:
    branches:
      - feature/ai-implementation

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  format-and-self-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/ai-implementation

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v5.2.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format AI eval fixtures with repository Prettier
        run: |
          pnpm exec prettier --write tooling/ai-evals/fixtures/*.json
          pnpm exec prettier --check tooling/ai-evals/fixtures/*.json

      - name: Commit formatted fixtures and remove this temporary workflow
        run: |
          git rm .github/workflows/ai-fixture-prettier-fix.yml
          git add tooling/ai-evals/fixtures/*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ai): format eval fixtures with repository Prettier"
          git push origin HEAD:feature/ai-implementation
