name: AI Main Sync Lab

on:
  push:
    branches:
      - integration/ai-main-sync-lab-2026-09-05-a1

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  full-integration-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reconciled lab branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate observability artifacts from current main
        run: python3 tooling/observability/validate.py

      - name: Validate pinned Alloy configuration from current main
        env:
          ALLOY_IMAGE: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
        run: |
          secret_dir="$(mktemp -d)"
          trap 'rm -rf -- "$secret_dir"' EXIT
          printf '%s' 'ci-not-a-real-token' > "$secret_dir/cloud-api-key"
          printf '%s' 'Basic Y2k6Y2ktbm90LWEtcmlnaHQ=' > "$secret_dir/otlp-authorization"
          printf '%s' 'postgresql://dante_observer:ci@127.0.0.1:5432/dante?sslmode=disable' > "$secret_dir/observer-dsn"
          docker run --rm \
            --env DANTE_ENV=ci \
            --env DANTE_BACKEND_HEALTH_URL=http://127.0.0.1:8000/health/ready \
            --env DANTE_FARO_ORIGIN_PRIMARY=https://localhost:5173 \
            --env DANTE_FARO_ORIGIN_SECONDARY=https://127.0.0.1:4173 \
            --env GRAFANA_CLOUD_OTLP_ENDPOINT=https://otlp.example.test/otlp \
            --env GRAFANA_CLOUD_OTLP_USERNAME=ci \
            --env GRAFANA_CLOUD_PROMETHEUS_URL=https://prometheus.example.test/api/prom/push \
            --env GRAFANA_CLOUD_PROMETHEUS_USERNAME=ci \
            --env GRAFANA_CLOUD_LOKI_URL=https://loki.example.test/loki/api/v1/push \
            --env GRAFANA_CLOUD_LOKI_USERNAME=ci \
            --volume "$PWD/infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            --volume "$secret_dir/cloud-api-key:/run/secrets/grafana_cloud_api_key:ro" \
            --volume "$secret_dir/otlp-authorization:/run/secrets/grafana_cloud_otlp_authorization:ro" \
            --volume "$secret_dir/observer-dsn:/run/secrets/dante_observer_dsn:ro" \
            "$ALLOY_IMAGE" validate /etc/alloy/config.alloy

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Restore bounded eval-tooling Ruff exceptions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path("tooling/ai-evals/run_gemini_native_runtime_smoke.py"): (
                  "# before importing DANTE modules and writes its machine-readable result directly to stdout.\n\n",
                  "# before importing DANTE modules and writes its machine-readable result directly to stdout.\n# ruff: noqa: E402, T201\n\n",
              ),
              Path("tooling/ai-evals/tests/test_decision_extension_v4.py"): (
                  "# Standalone eval-tooling tests bootstrap their local module path and use pytest assertions.\n\n",
                  "# Standalone eval-tooling tests bootstrap their local module path and use pytest assertions.\n# ruff: noqa: E402, S101\n\n",
              ),
              Path("tooling/ai-evals/tests/test_eval_tooling.py"): (
                  "# sys.path bootstrapping while remaining executable under pytest.\n\n",
                  "# sys.path bootstrapping while remaining executable under pytest.\n# ruff: noqa: E402, PT009, PT027\n\n",
              ),
          }
          for path, (old, new) in changes.items():
              text = path.read_text(encoding="utf-8")
              if "# ruff: noqa:" not in text:
                  if old not in text:
                      raise SystemExit(f"missing exact Ruff exception anchor: {path}")
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")

          core = Path("tooling/ai-evals/dante_eval_core.py")
          text = core.read_text(encoding="utf-8")
          plain = '    PASS = "PASS"\n'
          annotated = '    PASS = "PASS"  # noqa: S105 - verdict label, not a credential\n'
          if annotated not in text:
              if plain not in text:
                  raise SystemExit("TrialVerdict.PASS anchor missing")
              core.write_text(text.replace(plain, annotated, 1), encoding="utf-8")

          runner = Path("tooling/ai-evals/run_ai_foundation_closure_gate.sh")
          text = runner.read_text(encoding="utf-8")
          text = text.replace(
              "# S105 is a single tooling-only false positive: TrialVerdict.PASS = \"PASS\" is an enum value,\n"
              "# not a credential. All other selected Ruff rules remain active for the whole eval-tooling tree.\n",
              "",
              1,
          )
          text = text.replace(
              "  --config apps/backend/pyproject.toml --ignore S105 tooling/ai-evals\n",
              "  --config apps/backend/pyproject.toml tooling/ai-evals\n",
              1,
          )
          if "--ignore S105" in text:
              raise SystemExit("global S105 ignore still present")
          runner.write_text(text, encoding="utf-8")
          PY

          uv run --project apps/backend --locked ruff format \
            --config apps/backend/pyproject.toml tooling/ai-evals

          if ! git diff --quiet -- tooling/ai-evals; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tooling/ai-evals
            git commit -m "chore(ai): restore bounded eval lint contracts"
            git push origin HEAD:integration/ai-main-sync-lab-2026-09-05-a1
          fi

      - name: Run reconciled AI foundation closure gate with PostgreSQL
        run: bash tooling/ai-evals/run_ai_foundation_closure_gate.sh --with-postgres
