name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Backend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate observability artifacts
        run: python3 tooling/observability/validate.py

      - name: Validate pinned Alloy configuration
        env:
          ALLOY_IMAGE: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
        run: |
          secret_dir="$(mktemp -d)"
          trap 'rm -rf -- "$secret_dir"' EXIT
          printf '%s' 'ci-not-a-real-token' > "$secret_dir/cloud-api-key"
          printf '%s' 'Basic Y2k6Y2ktbm90LWEtcmVhbC10b2tlbg==' > "$secret_dir/otlp-authorization"
          printf '%s' 'postgresql://dante_observer:ci@127.0.0.1:5432/dante?sslmode=disable' > "$secret_dir/observer-dsn"
          docker run --rm \
            --env DANTE_ENV=ci \
            --env DANTE_BACKEND_HEALTH_URL=http://127.0.0.1:8000/health/ready \
            --env DANTE_FARO_ORIGIN_PRIMARY=https://localhost:5173 \
            --env DANTE_FARO_ORIGIN_SECONDARY=https://127.0.0.1:4173 \
            --env GRAFANA_CLOUD_OTLP_ENDPOINT=https://otlp.example.test/otlp \
            --env GRAFANA_CLOUD_OTLP_USERNAME=ci \
            --env GRAFANA_CLOUD_PROMETHEUS_URL=https://prometheus.example.test/api/prom/push \
            --env GRAFANA_CLOUD_PROMETHEUS_USERNAME=ci \
            --env GRAFANA_CLOUD_LOKI_URL=https://loki.example.test/loki/api/v1/push \
            --env GRAFANA_CLOUD_LOKI_USERNAME=ci \
            --volume "$PWD/infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            --volume "$secret_dir/cloud-api-key:/run/secrets/grafana_cloud_api_key:ro" \
            --volume "$secret_dir/otlp-authorization:/run/secrets/grafana_cloud_otlp_authorization:ro" \
            --volume "$secret_dir/observer-dsn:/run/secrets/dante_observer_dsn:ro" \
            "$ALLOY_IMAGE" validate /etc/alloy/config.alloy

      - name: Install canonical uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Verify locked dependency graph
        working-directory: apps/backend
        run: uv lock --check

      - name: Synchronize locked environment
        working-directory: apps/backend
        run: uv sync --locked

      - name: Show toolchain versions
        working-directory: apps/backend
        run: |
          uv --version
          uv run --locked python --version

      - name: Ruff format check
        working-directory: apps/backend
        run: uv run --locked ruff format --check .

      - name: Ruff lint
        working-directory: apps/backend
        run: uv run --locked ruff check .

      - name: mypy strict
        working-directory: apps/backend
        run: uv run --locked mypy

      - name: Fast test suite
        working-directory: apps/backend
        run: uv run --locked pytest -m "not postgres"

      - name: AI eval tooling deterministic gate
        run: |
          uv run --project apps/backend --locked ruff format --check \
            --config apps/backend/pyproject.toml tooling/ai-evals
          uv run --project apps/backend --locked ruff check \
            --config apps/backend/pyproject.toml tooling/ai-evals
          uv run --project apps/backend --locked pytest tooling/ai-evals/tests

      - name: Build backend package
        working-directory: apps/backend
        run: uv build

  postgres:
    name: Backend PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install canonical uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Verify locked dependency graph
        working-directory: apps/backend
        run: uv lock --check

      - name: Synchronize locked environment
        working-directory: apps/backend
        run: uv sync --locked

      - name: Show toolchain versions
        working-directory: apps/backend
        run: |
          uv --version
          uv run --locked python --version

      - name: Build canonical PostgreSQL image
        run: docker build --pull --tag dante-postgres-local:18.6 infra/local/postgres

      - name: PostgreSQL acceptance suite
        working-directory: apps/backend
        run: uv run --locked pytest -m postgres -vv

  gate:
    name: Backend CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs:
      - quality
      - postgres
    if: ${{ always() }}
    steps:
      - name: Require all mandatory backend jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          printf 'Backend Quality: %s\n' "$QUALITY_RESULT"
          printf 'Backend PostgreSQL: %s\n' "$POSTGRES_RESULT"
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$POSTGRES_RESULT" == "success" ]]
