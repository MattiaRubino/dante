name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/home-react
      - feature/home-timeline

permissions: {}

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend contract drift check
        run: python3 tests/prototypes/frontend-preprod-contracts.py

      - name: Format check
        if: ${{ github.ref != 'refs/heads/feature/home-react' && github.ref != 'refs/heads/feature/home-timeline' }}
        run: pnpm format:check

      - name: Format check for active Home workstreams
        if: ${{ github.ref == 'refs/heads/feature/home-react' || github.ref == 'refs/heads/feature/home-timeline' }}
        shell: bash
        run: |
          mapfile -d '' files < <(
            git diff-tree --no-commit-id --name-only -z -r HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.css' '*.scss' '*.json' \
              '*.md' '*.yml' '*.yaml' '*.html'
          )
          if ((${#files[@]} > 0)); then
            pnpm exec prettier --check "${files[@]}"
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture check
        run: pnpm architecture:check

      - name: Generated-source drift check
        run: pnpm generated:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Diff check
        run: git diff --check

      - name: Repository mutation check
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell and Linux dependencies
        run: pnpm --filter @dante/web exec playwright install --with-deps --only-shell chromium

      - name: Run Web E2E
        run: pnpm test:e2e:web

      - name: Install Firefox and Linux dependencies
        run: pnpm --filter @dante/web exec playwright install --with-deps firefox

      - name: Run frozen Timeline interaction contract in Firefox
        run: pnpm --filter @dante/web exec playwright test e2e/timeline-interactions.spec.ts --browser=firefox

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile-bundle:
    name: Mobile Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo dependency compatibility
        env:
          EXPO_OFFLINE: "1"
        run: pnpm mobile:compat:check

      - name: Android Hermes bundle smoke
        run: pnpm mobile:bundle:check

  frontend-ci-gate:
    name: Frontend CI Gate
    if: ${{ always() }}
    needs:
      - quality
      - web-e2e
      - mobile-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all frontend validation jobs
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          MOBILE_BUNDLE_RESULT: ${{ needs.mobile-bundle.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$WEB_E2E_RESULT" = "success"
          test "$MOBILE_BUNDLE_RESULT" = "success"
