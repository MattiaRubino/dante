name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/frontend-materialization

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture check
        run: pnpm architecture:check

      - name: Generated-source drift check
        run: pnpm generated:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Diff check
        run: git diff --check

      - name: Repository mutation check
        run: git diff --exit-code

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell and Linux dependencies
        run: pnpm --filter @dante/web exec playwright install --with-deps --only-shell chromium

      - name: Run Web E2E
        run: pnpm test:e2e:web

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile-bundle:
    name: Mobile Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Android Hermes bundle smoke
        run: pnpm mobile:bundle:check
