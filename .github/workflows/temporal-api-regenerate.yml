name: Temporal API Regenerate

on:
  push:
    branches:
      - feature/timeline-temporal-operational
    paths:
      - .github/workflows/temporal-api-regenerate.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Generate governed API artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize backend environment
        working-directory: apps/backend
        run: uv sync --locked

      - name: Generate canonical API artifacts
        run: pnpm api:generate

      - name: Prove OpenAPI snapshot
        working-directory: apps/backend
        run: uv run --locked pytest tests/test_openapi_export.py -q

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated artifacts
        run: |
          git config user.name "dante-ci"
          git config user.email "dante-ci@users.noreply.github.com"
          git add packages/api-client/openapi/dante-v1.openapi.json packages/api-client/src/generated
          if git diff --cached --quiet; then
            echo "No API artifact drift remained."
            exit 0
          fi
          git commit -m "chore(api): regenerate temporal B01 client artifacts"
          git push origin HEAD:feature/timeline-temporal-operational
