name: Temporal B01 One-Shot Proof

on:
  push:
    branches:
      - feature/timeline-temporal-operational
    paths:
      - .github/workflows/temporal-b01-one-shot.yml

permissions:
  contents: read

jobs:
  b01-proof:
    name: B01 Activity full-stack proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell and Linux dependencies
        run: pnpm --filter @dante/web exec playwright install --with-deps --only-shell chromium

      - name: Run targeted B01 Activity E2E
        run: |
          pnpm --filter @dante/web exec playwright test \
            --config playwright.auth.config.ts \
            e2e/auth/temporal-b01-activity.spec.ts \
            --project=chromium
