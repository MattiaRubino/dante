name: Temporal B01 Reconciliation One-Shot
# proof-revision: b01-truthfulness-1

on:
  push:
    branches:
      - feature/timeline-temporal-operational
    paths:
      - .github/workflows/temporal-b01-reconciliation-one-shot.yml

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: temporal-b01-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-quality:
    name: B01 reconciliation backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate observability artifacts
        run: python3 tooling/observability/validate.py

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Verify and synchronize locked backend environment
        working-directory: apps/backend
        run: |
          uv lock --check
          uv sync --locked

      - name: Ruff format check
        working-directory: apps/backend
        run: uv run --locked ruff format --check .

      - name: Ruff lint
        working-directory: apps/backend
        run: uv run --locked ruff check .

      - name: mypy strict
        working-directory: apps/backend
        run: uv run --locked mypy

      - name: Fast backend suite
        working-directory: apps/backend
        run: uv run --locked pytest -m "not postgres"

      - name: Build backend package
        working-directory: apps/backend
        run: uv build

      - name: Repository diff check
        run: git diff --check

  postgres:
    name: B01 reconciliation PostgreSQL 18.6
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Verify and synchronize locked backend environment
        working-directory: apps/backend
        run: |
          uv lock --check
          uv sync --locked

      - name: Build canonical PostgreSQL image
        run: docker build --pull --tag dante-postgres-local:18.6 infra/local/postgres

      - name: Full PostgreSQL acceptance suite
        working-directory: apps/backend
        run: uv run --locked pytest -m postgres -vv

  frontend-proof:
    name: B01 reconciliation frontend and real full-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Synchronize locked backend environment
        working-directory: apps/backend
        run: uv sync --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend contract drift check
        run: |
          python3 tests/prototypes/frontend-preprod-contracts.py
          python3 tests/prototypes/world-focus-preprod-contracts.py

      - name: Frontend quality and generated-source gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm architecture:check
          pnpm generated:check
          pnpm test
          pnpm build

      - name: Mobile compatibility and bundle smoke
        env:
          EXPO_OFFLINE: "1"
        run: |
          pnpm mobile:compat:check
          pnpm mobile:bundle:check

      - name: Build canonical PostgreSQL image for full-stack proof
        run: docker compose -f infra/compose/local.yaml build postgres

      - name: Install Chromium and Firefox browser dependencies
        run: |
          pnpm --filter @dante/web exec playwright install --with-deps --only-shell chromium
          pnpm --filter @dante/web exec playwright install --with-deps firefox

      - name: Run B00 real full-stack Chromium proof
        run: |
          pnpm --filter @dante/web exec playwright test \
            --config playwright.auth.config.ts \
            e2e/auth/temporal-b00-runtime-spine.spec.ts \
            --project=chromium \
            --workers=1

      - name: Run B01 real full-stack Chromium proof
        run: |
          pnpm --filter @dante/web exec playwright test \
            --config playwright.auth.config.ts \
            e2e/auth/temporal-b01-activity.spec.ts \
            --project=chromium \
            --workers=1

      - name: Run frozen T1 Firefox interaction contract
        run: |
          pnpm --filter @dante/web exec playwright test \
            e2e/timeline-interactions.spec.ts \
            --browser=firefox

      - name: Repository mutation check
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporal-b01-reconciliation-playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Temporal B01 reconciliation gate
    if: ${{ always() }}
    needs:
      - backend-quality
      - postgres
      - frontend-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every reconciliation proof
        env:
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend-proof.result }}
        run: |
          printf 'Backend quality: %s\n' "$BACKEND_RESULT"
          printf 'PostgreSQL: %s\n' "$POSTGRES_RESULT"
          printf 'Frontend/full-stack: %s\n' "$FRONTEND_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
