name: Temporal B01 Format Diagnostic

on:
  push:
    branches:
      - feature/timeline-temporal-operational
    paths:
      - .github/workflows/temporal-b01-reconciliation-one-shot.yml

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: temporal-b01-format-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-format:
    name: B01 backend canonical formatting diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install canonical uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: apps/backend
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: false

      - name: Install project Python
        working-directory: apps/backend
        run: uv python install

      - name: Synchronize locked backend environment
        working-directory: apps/backend
        run: uv sync --locked

      - name: Emit canonical Ruff output
        working-directory: apps/backend
        run: |
          set -euo pipefail
          files=(
            migrations/versions/20260908_19_activity_core.py
            src/dante/modules/temporal/activity.py
            tests/integration/temporal/test_b01_activity_core.py
          )
          uv run --locked ruff format "${files[@]}"
          git diff --no-ext-diff -- "${files[@]}"
          for file in "${files[@]}"; do
            printf 'BEGIN_FORMATTED_FILE %s\n' "$file"
            base64 -w0 "$file"
            printf '\nEND_FORMATTED_FILE %s\n' "$file"
          done
          git diff --check

  frontend-format:
    name: B01 frontend canonical formatting diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit canonical Prettier output
        run: |
          set -euo pipefail
          files=(
            apps/web/src/features/home/ui/timeline/model/timeline-fixtures.ts
            apps/web/src/features/temporal-create/ui/temporal-create-context-catalog.tsx
            apps/web/src/features/temporal/remote-timeline-read.ts
            packages/i18n/src/resources/it/temporal-runtime.ts
          )
          pnpm exec prettier --write "${files[@]}"
          git diff --no-ext-diff -- "${files[@]}"
          for file in "${files[@]}"; do
            printf 'BEGIN_FORMATTED_FILE %s\n' "$file"
            base64 -w0 "$file"
            printf '\nEND_FORMATTED_FILE %s\n' "$file"
          done
          git diff --check
