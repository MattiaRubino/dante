[project]
name = "dante-backend"
version = "0.1.0"
description = "DANTE production backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn[standard]>=0.52.1,<0.53",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dante"

[dependency-groups]
quality = [
    "ruff>=0.16.2,<0.17",
    "mypy>=2.3.0,<3",
]
test = [
    "pytest>=9.1.1,<10",
    "httpx2>=2.9.1,<3",
    "pytest-cov>=7.1.0,<8",
]
dev = [
    { include-group = "quality" },
    { include-group = "test" },
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true
files = ["src", "tests"]
enable_error_code = ["explicit-override", "exhaustive-match"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov=dante",
    "--cov-report=term-missing",
]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["dante"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
