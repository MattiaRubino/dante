[project]
name = "dante-backend"
version = "0.1.0"
description = "DANTE production backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn[standard]>=0.52.1,<0.53",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "psycopg[binary]>=3.3.4,<3.4",
    "alembic>=1.19.1,<1.20",
    "argon2-cffi>=25.1.0,<26",
    "email-validator>=2.3.0,<3",
    "httpx2>=2.12.0,<3",
    "fido2==2.2.1",
    "joserfc==1.7.4",
    "cryptography==50.0.1",
    "boto3>=1.40,<2",
    "botocore>=1.40,<2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.5"

[tool.uv.build-backend]
module-name = "dante"

[dependency-groups]
quality = [
    "ruff>=0.16.2,<0.17",
    "mypy>=2.3.0,<3",
]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.0,<2",
]
uat = [
    # Botocore's browser-login credential provider requires AWS CRT. Keep this out of the
    # production dependency set: workload/role credentials do not need the local UAT login stack.
    "botocore[crt]>=1.40,<2",
]
dev = [
    { include-group = "quality" },
    { include-group = "test" },
    { include-group = "uat" },
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s/src"]
output_encoding = "utf-8"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.format]
# Applied migrations listed below remain byte-stable under MIG-02. Formatter exclusion
# prevents style-only rewrites; Ruff lint still covers them with the exact historical findings
# documented below. Revisions not listed here, including current 20260830_09, use normal checks.
exclude = [
    "migrations/versions/20260825_01_cp6_native_identity_address.py",
    "migrations/versions/20260825_02_cp6_scoped_material_control.py",
    "migrations/versions/20260825_03_cp6_schedule_actual_session.py",
    "migrations/versions/20260825_04_cp6_recurrence.py",
    "migrations/versions/20260825_05_cp6_core_integrity_current_views.py",
    "migrations/versions/20260826_06_cp6_occurrence_generation.py",
    "migrations/versions/20260826_07_cp6_runtime_acl_activation.py",
]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# Applied CP6 migrations are byte-stable under MIG-02. These are only the exact historical
# Ruff findings already present in those immutable revisions; no src/test quality rule is relaxed.
"migrations/versions/20260825_01_cp6_native_identity_address.py" = ["I001", "RUF005"]
"migrations/versions/20260825_02_cp6_scoped_material_control.py" = ["I001"]
"migrations/versions/20260825_03_cp6_schedule_actual_session.py" = ["I001"]
"migrations/versions/20260825_04_cp6_recurrence.py" = ["I001"]
"migrations/versions/20260825_05_cp6_core_integrity_current_views.py" = ["I001", "S608"]
"migrations/versions/20260826_06_cp6_occurrence_generation.py" = ["I001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true
files = ["src", "tests"]
enable_error_code = ["explicit-override", "exhaustive-match"]

# fido2 2.2.1 exposes ES256.from_cryptography_key without typing metadata. Keep the
# exception restricted to the two tests that exercise the real third-party boundary.
[[tool.mypy.overrides]]
module = [
    "tests.test_auth_webauthn",
    "tests.integration.auth.test_m5_passkeys",
]
disable_error_code = ["no-untyped-call"]

# These HTTP-contract tests intentionally use minimal structural fakes instead of constructing
# heavyweight runtime services. Production code remains fully strict; only fake-to-concrete
# argument compatibility is suppressed in these focused test modules.
[[tool.mypy.overrides]]
module = [
    "tests.test_auth_m5_provider_api",
    "tests.test_auth_m5_passkey_api",
    "tests.test_auth_m5_api",
]
disable_error_code = ["arg-type"]

# SQLAlchemy exposes column_descriptions through a runtime-shaped tuple that mypy cannot narrow
# after the exact length guard used by this concurrency test.
[[tool.mypy.overrides]]
module = ["tests.integration.auth.test_m5_passkeys"]
disable_error_code = ["misc"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov=dante",
    "--cov-report=term-missing",
]
strict = true
filterwarnings = ["error"]
markers = [
    "postgres: requires the real DANTE PostgreSQL 18.6 integration boundary",
]
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["dante"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
