[project]
name = "dante-backend"
version = "0.1.0"
description = "DANTE production backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn[standard]>=0.52.1,<0.53",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "psycopg[binary]>=3.3.4,<3.4",
    "alembic>=1.19.1,<1.20",
    "argon2-cffi>=25.1.0,<26",
    "email-validator>=2.3.0,<3",
    "httpx2>=2.12.0,<3",
    "opentelemetry-api>=1.44.0,<1.45",
    "opentelemetry-sdk>=1.44.0,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<1.45",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.5"

[tool.uv.build-backend]
module-name = "dante"

[dependency-groups]
quality = [
    "ruff>=0.16.2,<0.17",
    "mypy>=2.3.0,<3",
]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.0,<2",
]
dev = [
    { include-group = "quality" },
    { include-group = "test" },
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s/src"]
output_encoding = "utf-8"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.format]
# Applied CP6 migrations are immutable evidence under MIG-02. Formatter exclusion prevents
# style-only history rewrites; Ruff lint still covers them with only the exact historical
# findings documented below. The current CP6-05 candidate revision is not excluded.
exclude = [
    "migrations/versions/20260825_01_cp6_native_identity_address.py",
    "migrations/versions/20260825_02_cp6_scoped_material_control.py",
    "migrations/versions/20260825_03_cp6_schedule_actual_session.py",
    "migrations/versions/20260825_04_cp6_recurrence.py",
    "migrations/versions/20260825_05_cp6_core_integrity_current_views.py",
    "migrations/versions/20260826_06_cp6_occurrence_generation.py",
    "migrations/versions/20260826_07_cp6_runtime_acl_activation.py",
]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# Applied CP6 migrations are byte-stable under MIG-02. These are only the exact historical
# Ruff findings already present in those immutable revisions; no src/test quality rule is relaxed.
"migrations/versions/20260825_01_cp6_native_identity_address.py" = ["I001", "RUF005"]
"migrations/versions/20260825_02_cp6_scoped_material_control.py" = ["I001"]
"migrations/versions/20260825_03_cp6_schedule_actual_session.py" = ["I001"]
"migrations/versions/20260825_04_cp6_recurrence.py" = ["I001"]
"migrations/versions/20260825_05_cp6_core_integrity_current_views.py" = ["I001", "S608"]
"migrations/versions/20260826_06_cp6_occurrence_generation.py" = ["I001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true
files = ["src", "tests"]
enable_error_code = ["explicit-override", "exhaustive-match"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov=dante",
    "--cov-report=term-missing",
]
strict = true
filterwarnings = ["error"]
markers = [
    "postgres: requires the real DANTE PostgreSQL 18.6 integration boundary",
]
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["dante"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
