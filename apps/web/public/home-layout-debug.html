<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DANTE — Home M1 geometry debug</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #151515;
      background: #f5f5f3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    header { max-width: 1440px; margin: 0 auto 22px; }
    h1 { margin: 0; font-size: 24px; }
    header p { margin: 7px 0 0; color: #666; font-size: 14px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 16px; font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .swatch { width: 18px; height: 12px; border: 2px solid currentColor; background: color-mix(in srgb, currentColor 10%, white); }
    .grid { max-width: 1440px; margin: 0 auto; display: grid; gap: 28px; }
    .case { padding: 18px; border: 1px solid #d6d6d1; border-radius: 14px; background: white; box-shadow: 0 6px 24px rgba(0,0,0,.04); }
    .case h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
    .scale-shell { position: relative; width: 100%; overflow: hidden; border: 1px solid #aaa; background: #fff; }
    .viewport { position: absolute; top: 0; left: 0; width: 1600px; height: 1100px; transform-origin: 0 0; background: #fff; }
    .rect { position: absolute; display: grid; place-items: center; overflow: hidden; border: 3px solid currentColor; background: color-mix(in srgb, currentColor 9%, white); color: #222; font-size: 20px; font-weight: 700; text-align: center; }
    .rect small { display: block; margin-top: 5px; font-size: 14px; font-weight: 550; color: #555; }
    .technical { border-style: dashed; background: transparent; color: #3c66d6; pointer-events: none; }
    .technical > span { align-self: start; justify-self: start; margin: 8px; padding: 4px 7px; background: white; border: 1px solid currentColor; font-size: 12px; }
    .safe { color: #2467d1; background: rgba(36,103,209,.09); }
    .selector-slot { color: #6d57b7; background: rgba(109,87,183,.08); border-style: dashed; font-size: 15px; }
    .topbar { color: #222; }
    .day { color: #9a7618; }
    .ai { color: #315c94; }
    .now { color: #d66a2c; }
    .evidence { color: #9b4f8d; }
    .for-you { color: #2f8c6d; }
    .timeline { color: #277a7d; }
    .rail { color: #8a5c31; }
    .rail-split { position: absolute; left: 0; right: 0; height: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
    .rail-split + .rail-split { top: 50%; border-top: 2px dashed currentColor; }
    .margin { color: #aaa; background: repeating-linear-gradient(135deg,#fafafa,#fafafa 10px,#f0f0f0 10px,#f0f0f0 20px); border-color: #bbb; font-size: 12px; }
    .note { margin-top: 12px; color: #666; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <header>
    <h1>Home M1 — sole aree geometriche</h1>
    <p>Reference desktop 1600px. Nessun contenuto della Home: solo ownership, rettangoli e aree realmente utilizzabili.</p>
    <div class="legend">
      <span style="color:#315c94"><i class="swatch"></i> AI</span>
      <span style="color:#d66a2c"><i class="swatch"></i> Ora e prossimo</span>
      <span style="color:#9b4f8d"><i class="swatch"></i> In evidenza</span>
      <span style="color:#2f8c6d"><i class="swatch"></i> Per te</span>
      <span style="color:#2467d1"><i class="swatch"></i> Stage usable area</span>
      <span style="color:#277a7d"><i class="swatch"></i> Timeline</span>
      <span style="color:#8a5c31"><i class="swatch"></i> Context Rail</span>
    </div>
  </header>

  <main class="grid" id="cases"></main>

  <script>
    const W = 1600;
    const H = 1100;
    const TOPBAR_H = 64;
    const HERO_H = 650;
    const HERO_Y = TOPBAR_H;
    const DAY_Y = HERO_Y + 8;
    const DAY_H = 74;
    const BODY_Y = HERO_Y + 118;
    const BODY_H = HERO_H - 118 - 18; // 514
    const TODAY_Y = HERO_Y + HERO_H + 10;
    const TODAY_H = H - TODAY_Y;

    const OUTER = 34;
    const AI_W = 376; // 23.5vw at 1600px
    const AI_GAP = 28;
    const WORK_X_EXPANDED = OUTER + AI_W + AI_GAP;
    const WORK_W_EXPANDED = W - WORK_X_EXPANDED - OUTER;

    const COLLAPSED_RAIL = 58;
    const COLLAPSED_RAIL_GAP = 30;
    const WORK_X_COLLAPSED = COLLAPSED_RAIL + COLLAPSED_RAIL_GAP;
    const WORK_W_COLLAPSED = W - WORK_X_COLLAPSED - OUTER;
    const COLLAPSED_SIDE = 272; // clamp(260px, 17vw, 320px) at 1600px
    const COLLAPSED_COL_GAP = 20;
    const COLLAPSED_EVIDENCE_H = BODY_H * .25;
    const COLLAPSED_STAGE_GAP = 12;

    const TODAY_RIGHT_MARGIN = 18;
    const RAIL_W = 306;
    const TODAY_GAP = 16;

    const cases = [
      { title: 'AI ESPANSA · TIMELINE NORMALE', ai: 'expanded', timeline: 'normal' },
      { title: 'AI COMPRESSA · TIMELINE NORMALE', ai: 'collapsed', timeline: 'normal' },
      { title: 'AI ESPANSA · TIMELINE ESPANSA', ai: 'expanded', timeline: 'expanded' },
      { title: 'AI COMPRESSA · TIMELINE ESPANSA', ai: 'collapsed', timeline: 'expanded' },
    ];

    function rect(className, label, x, y, w, h, extra = '') {
      return `<div class="rect ${className}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${label}${extra}</div>`;
    }

    function expandedWorkspace() {
      const x = WORK_X_EXPANDED;
      const w = WORK_W_EXPANDED;
      const sideW = w * .295;
      const evidenceX = x + w * .32;
      const evidenceW = w * .36;
      const sideH = BODY_H * .47;
      const evidenceH = BODY_H * .22;
      const notchX = x + w * .295;
      const notchW = w * .41;
      const notchY = BODY_Y + BODY_H * .24;
      const notchH = BODY_H * (.47 - .24);
      const safeY = BODY_Y + BODY_H * .47;
      const safeH = BODY_H * .53;

      return [
        rect('technical', '<span>CENTRAL STAGE — technical bounds</span>', x, BODY_Y, w, BODY_H),
        rect('now', 'ORA E PROSSIMO', x, BODY_Y, sideW, sideH),
        rect('evidence', 'IN EVIDENZA', evidenceX, BODY_Y, evidenceW, evidenceH),
        rect('for-you', 'PER TE', x + w - sideW, BODY_Y, sideW, sideH),
        rect('selector-slot', 'STAGE SELECTOR SLOT', notchX, notchY, notchW, notchH),
        rect('safe', 'STAGE PROJECTION SAFE AREA<small>Mondi / Sintesi</small>', x, safeY, w, safeH),
      ].join('');
    }

    function collapsedWorkspace() {
      const x = WORK_X_COLLAPSED;
      const w = WORK_W_COLLAPSED;
      const stageX = x + COLLAPSED_SIDE + COLLAPSED_COL_GAP;
      const stageY = BODY_Y + COLLAPSED_EVIDENCE_H + COLLAPSED_STAGE_GAP;
      const stageW = w - COLLAPSED_SIDE - COLLAPSED_COL_GAP;
      const stageH = BODY_Y + BODY_H - stageY;

      return [
        rect('now', 'ORA E PROSSIMO', x, BODY_Y, COLLAPSED_SIDE, BODY_H / 2),
        rect('for-you', 'PER TE', x, BODY_Y + BODY_H / 2, COLLAPSED_SIDE, BODY_H / 2),
        rect('evidence', 'IN EVIDENZA', stageX, BODY_Y, stageW, COLLAPSED_EVIDENCE_H),
        rect('technical', '<span>CENTRAL STAGE — actual collapsed bounds</span>', stageX, stageY, stageW, stageH),
        rect('safe', 'STAGE PROJECTION AREA<small>Mondi / Sintesi</small>', stageX, stageY, stageW, stageH),
        rect('selector-slot', 'SELECTOR ANCHOR', stageX + stageW * .38, stageY + stageH * .12, stageW * .24, 74),
      ].join('');
    }

    function todayLayout(timelineState) {
      const totalW = W - TODAY_RIGHT_MARGIN;
      if (timelineState === 'expanded') {
        return [
          rect('timeline', 'TIMELINE — EXPANDED', 0, TODAY_Y, totalW, TODAY_H),
          rect('margin', '18px', totalW, TODAY_Y, TODAY_RIGHT_MARGIN, TODAY_H),
        ].join('');
      }
      const timelineW = totalW - RAIL_W - TODAY_GAP;
      const railX = timelineW + TODAY_GAP;
      return [
        rect('timeline', 'TIMELINE', 0, TODAY_Y, timelineW, TODAY_H),
        rect('rail', '<span style="position:absolute;top:10px">CONTEXT RAIL</span><div class="rail-split" style="top:0">CAPTURE</div><div class="rail-split">RESOLUTION</div>', railX, TODAY_Y, RAIL_W, TODAY_H),
        rect('margin', '18px', totalW, TODAY_Y, TODAY_RIGHT_MARGIN, TODAY_H),
      ].join('');
    }

    function renderCase(spec) {
      const aiMarkup = spec.ai === 'expanded'
        ? rect('ai', 'AI CHAT — EXPANDED', 0, BODY_Y, OUTER + AI_W, BODY_H)
        : rect('ai', 'AI<br>RAIL<br>58px', 0, BODY_Y, COLLAPSED_RAIL, BODY_H);

      const workspace = spec.ai === 'expanded' ? expandedWorkspace() : collapsedWorkspace();

      return `
        <section class="case">
          <h2>${spec.title}</h2>
          <div class="scale-shell">
            <div class="viewport">
              ${rect('topbar', 'GLOBAL TOPBAR', 0, 0, W, TOPBAR_H)}
              ${rect('day', 'DAY CONTEXT STRIP', OUTER, DAY_Y, W - OUTER * 2, DAY_H)}
              ${aiMarkup}
              ${workspace}
              ${todayLayout(spec.timeline)}
            </div>
          </div>
          <div class="note">Il tratteggio blu indica il bounding box tecnico del Central Stage; il blu pieno indica la zona in cui una projection può stare senza invadere aree riservate.</div>
        </section>`;
    }

    document.querySelector('#cases').innerHTML = cases.map(renderCase).join('');

    function scaleAll() {
      document.querySelectorAll('.scale-shell').forEach((shell) => {
        const viewport = shell.querySelector('.viewport');
        const scale = shell.clientWidth / W;
        viewport.style.transform = `scale(${scale})`;
        shell.style.height = `${H * scale}px`;
      });
    }

    addEventListener('resize', scaleAll, { passive: true });
    scaleAll();
  </script>
</body>
</html>
