name: dante-local

services:
  postgres:
    build:
      context: ../local/postgres
    image: dante-postgres-local:18.4
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dante
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U postgres -d dante
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.local
