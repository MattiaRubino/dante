services:
  postgres:
    image: dante-postgres-recovery:18.6-pgbackrest-2.59.1
    ports: !override
      - "127.0.0.1:55432:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - archive_mode=on
      - -c
      - "archive_command=/usr/bin/pgbackrest --stanza=dante archive-push %p"
