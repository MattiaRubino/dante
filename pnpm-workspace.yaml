packages:
  - apps/*
  - packages/*

# Supply-chain delay is explicit repository policy. pnpm 11 defaults to one day,
# but DANTE records it here so the invariant survives tool/default changes.
minimumReleaseAge: 1440

# Dependency build scripts are denied by default. Approve only exact reviewed versions.
allowBuilds:
  'esbuild@0.28.2': true
