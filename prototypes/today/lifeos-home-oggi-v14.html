<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS — Home Oggi v14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LIFEOS — TOKEN DI TEMA
   Unico punto di modifica per colori, font, raggi, ombre.
   Cambiare un tema o un colore = modificare qui, non nei componenti.
   Ruoli condivisi tra chiaro/scuro; solo i valori cambiano.
   ============================================================ */
:root,
[data-theme="light"]{
  --bg-page:#F5F6FA;
  --surface-base:#FFFFFF;
  --surface-elevated:#FFFFFF;
  --surface-hover:#EFF1F6;
  --sidebar-bg:#12162A;
  --border:#E3E6EE;
  --border-strong:#CDD2E0;

  --text-primary:#12162A;
  --text-secondary:#565F76;
  --text-muted:#656E82;
  --text-on-dark:#F5F7FB;
  --text-on-dark-muted:#8891A6;

  --violet-400:#9A82FF;
  --violet-500:#7C5CFC;
  --violet-solid:#5D3FE0;
  --violet-text:#5D3FE0;
  --violet-onfill:#FFFFFF;
  --violet-tint:rgba(124,92,252,.10);

  --coral-500:#DD6B4A;
  --coral-text:#93401F;
  --coral-tint:rgba(221,107,74,.14);

  --success:#2A9E6B; --success-text:#1B7A50; --success-tint:rgba(56,201,140,.12);
  --warning:#B87A1A; --warning-text:#855312; --warning-tint:rgba(242,169,59,.16);
  --danger:#D93C48;  --danger-text:#B8283A;  --danger-tint:rgba(240,92,103,.12);
  --info:#2568D6;    --info-text:#2568D6;    --info-tint:rgba(74,144,255,.12);

  --shadow-card:0 1px 0 rgba(18,22,42,.02), 0 8px 20px rgba(18,22,42,.06);
  --shadow-elevated:0 1px 0 rgba(18,22,42,.03), 0 16px 34px rgba(18,22,42,.10), 0 0 0 1px rgba(18,22,42,.03);
  --shadow-active:0 0 0 1px rgba(124,92,252,.35), 0 8px 24px rgba(124,92,252,.14);
  --glow-ai:radial-gradient(circle at 20% 0%, rgba(124,92,252,.14), transparent 60%);
  --timeline-path-past:rgba(18,22,42,.22);
  --timeline-path-future:rgba(18,22,42,.72);
}

[data-theme="dark"]{
  --bg-page:#08101D;
  --surface-base:#111B2B;
  --surface-elevated:#162235;
  --surface-hover:#1B2940;
  --sidebar-bg:#0A121F;
  --border:#243249;
  --border-strong:#33455F;

  --text-primary:#F5F7FB;
  --text-secondary:#A6B0C2;
  --text-muted:#828CA3;
  --text-on-dark:#F5F7FB;
  --text-on-dark-muted:#8891A6;

  --violet-400:#9A82FF;
  --violet-500:#7C5CFC;
  --violet-solid:#5D3FE0;
  --violet-text:#9A82FF;
  --violet-onfill:#FFFFFF;
  --violet-tint:rgba(124,92,252,.14);

  --coral-500:#E2793D;
  --coral-text:#F0975E;
  --coral-tint:rgba(226,121,61,.16);

  --success:#38C98C; --success-text:#38C98C; --success-tint:rgba(56,201,140,.14);
  --warning:#F2A93B; --warning-text:#F2A93B; --warning-tint:rgba(242,169,59,.14);
  --danger:#F05C67;  --danger-text:#F68089;  --danger-tint:rgba(240,92,103,.14);
  --info:#4A90FF;    --info-text:#7FB0FF;    --info-tint:rgba(74,144,255,.14);

  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.18);
  --shadow-elevated:0 1px 0 rgba(255,255,255,.05) inset, 0 16px 40px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.04);
  --shadow-active:0 0 0 1px rgba(124,92,252,.45), 0 8px 30px rgba(124,92,252,.16);
  --glow-ai:radial-gradient(circle at 20% 0%, rgba(124,92,252,.20), transparent 55%);
  --timeline-path-past:rgba(255,255,255,.22);
  --timeline-path-future:rgba(255,255,255,.96);
}

/* Font e raggi: anche questi in un punto solo */
:root{
  --font-display:'Space Grotesk', sans-serif;
  --font-ui:'Manrope', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--bg-page); color:var(--text-primary); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; transition:background .25s var(--ease), color .25s var(--ease);
}
button,input{font-family:inherit;}
:focus-visible{outline:2px solid var(--violet-500); outline-offset:2px;}
.icon{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

/* ============================================================ APP SHELL ============================================================ */
.app{display:flex; min-height:100vh;}

/* ---- sidebar ---- */
.sidebar{width:236px; flex-shrink:0; background:var(--sidebar-bg); display:flex; flex-direction:column; padding:20px 14px;}
.sidebar__brand{display:flex; align-items:center; gap:9px; padding:6px 8px 22px; color:var(--text-on-dark); font:600 16px/1 var(--font-display);}
.sidebar__brand-mark{width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg, var(--violet-400), var(--violet-solid)); flex-shrink:0;}
.sidebar__section-label{font:600 10.5px/1 var(--font-ui); text-transform:uppercase; letter-spacing:.07em; color:var(--text-on-dark-muted); padding:14px 10px 8px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; color:var(--text-on-dark-muted);
  font:500 13.5px/1 var(--font-ui); margin-bottom:1px; cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.05); color:var(--text-on-dark);}
.nav-item.is-active{background:var(--violet-tint); color:var(--text-on-dark);}
.nav-item.is-active .icon{color:var(--violet-400);}
.sidebar__spacer{flex:1;}
.sidebar__foot{border-top:1px solid rgba(255,255,255,.08); padding-top:10px; margin-top:10px;}

/* ---- main ---- */
.main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1360px;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:22px;}
.topbar__greeting{font:600 27px/1.2 var(--font-display); display:flex; align-items:center; gap:8px;}
.topbar__date{font:500 13px/1.4 var(--font-ui); color:var(--text-secondary); margin-top:3px;}
.topbar__search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:9px; background:var(--surface-elevated);
  border:1px solid var(--border); border-radius:999px; padding:10px 16px; color:var(--text-muted); font-size:13.5px;
}
.topbar__search kbd{margin-left:auto; font:500 10.5px/1 var(--font-mono); border:1px solid var(--border-strong); border-radius:5px; padding:3px 6px;}
.topbar__actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:38px; height:38px; border-radius:11px; background:var(--surface-elevated); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--text-secondary); position:relative; flex-shrink:0;
}
.icon-btn--fill{background:var(--violet-solid); color:var(--violet-onfill); border:none;}
.icon-btn__dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:2px solid var(--bg-page);}
.avatar{width:38px; height:38px; border-radius:11px; background:var(--coral-500); display:flex; align-items:center; justify-content:center; color:#fff; font:600 13px/1 var(--font-ui); flex-shrink:0;}

/* ---- week strip ---- */
.weekstrip{display:flex; gap:8px; margin-bottom:20px;}
.weekday{
  flex:1; background:var(--surface-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 6px;
  text-align:center; cursor:pointer; font-family:inherit;
}
.weekday__label{font:600 10px/1 var(--font-ui); text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); display:block; margin-bottom:6px;}
.weekday__num{font:600 16px/1 var(--font-display); color:var(--text-primary); position:relative; display:inline-block;}
.weekday__today-dot{position:absolute; top:-4px; right:-7px; width:5px; height:5px; border-radius:50%; background:var(--violet-text);}
.weekday__load{width:5px; height:5px; border-radius:50%; margin:6px auto 0;}
.weekday.is-selected{border-color:var(--violet-500); background:var(--violet-tint); box-shadow:var(--shadow-active);}
.weekday.is-selected .weekday__num{color:var(--violet-text);}

/* ---- timeline header / toggle ---- */
.tl-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:12px; flex-wrap:wrap;}
.tl-head h2{font:600 15px/1 var(--font-display); margin:0;}
.tl-head__meta{font:500 12px/1 var(--font-ui); color:var(--text-secondary); margin-left:10px;}
.tl-toggle{
  display:flex; align-items:center; gap:6px; background:var(--surface-elevated); border:1px solid var(--border-strong);
  border-radius:999px; padding:7px 13px; font:600 12px/1 var(--font-ui); color:var(--text-secondary); cursor:pointer;
}
.tl-toggle .icon{width:13px; height:13px;}
.tl-toggle:hover{border-color:var(--violet-500); color:var(--text-primary);}

.content-grid{display:grid; grid-template-columns:1fr 12px 296px; gap:10px; align-items:start; position:relative;}
.timeline{position:relative;}

/* ---- maniglia di trascinamento tra timeline e pannello ---- */
.drag-handle{
  align-self:stretch; display:flex; align-items:center; justify-content:center; cursor:col-resize;
  border-radius:999px; touch-action:none; user-select:none;
}
.drag-handle__grip{width:4px; height:52px; border-radius:999px; background:var(--border-strong); transition:background .15s var(--ease);}
.drag-handle:hover .drag-handle__grip, .drag-handle.is-dragging .drag-handle__grip{background:var(--violet-500);}

/* ============================================================ GRIGLIA ORARIA — vista unica, deformabile ============================================================ */
.tl-grid{
  background:var(--surface-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-elevated);
  max-height:min(66vh, 620px); overflow-y:auto; position:relative;
}
.tl-cat-headers{position:sticky; top:0; left:0; right:0; z-index:6; display:flex; height:0; pointer-events:none;}
.tl-cat-headers__inner{position:absolute; top:0; left:72px; right:0; height:30px; background:var(--surface-elevated); border-bottom:1px solid var(--border); opacity:0;}
.tl-cat-header{position:absolute; top:0; height:30px; display:flex; align-items:center; gap:6px; padding:0 4px; font:600 11px/1 var(--font-ui); color:var(--text-secondary); white-space:nowrap; overflow:hidden;}
.tl-cat-header__dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.tl-cat-header__dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.tl-cat-header__dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
</style>
</head>
<body>
<p>Prototype source is preserved in the local artifact for this iteration.</p>
</body>
</html>
